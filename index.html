<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Web Server v1.2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
        }
        
        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #764ba2;
            font-size: 1.1em;
        }
        
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: linear-gradient(135deg, #f5f7fa 0%, #f0f0f0 100%);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border-left: 5px solid #667eea;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        
        .card-title {
            color: #764ba2;
            font-size: 1.3em;
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        .card-value {
            color: #333;
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .card-unit {
            color: #999;
            font-size: 0.9em;
        }

        #rfidUid { overflow-wrap: anywhere; font-size: 1.4em; }
        #rfidError { color: #b42318; overflow-wrap: anywhere; }
        
        .buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:active {
            transform: scale(0.98);
        }
        
        .status {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 5px solid #667eea;
        }
        
        .status-title {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }
        
        .status-item:last-child {
            border-bottom: none;
        }
        
        .status-label {
            color: #666;
        }
        
        .status-value {
            color: #333;
            font-weight: bold;
        }
        
        footer {
            text-align: center;
            color: #999;
            font-size: 0.9em;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .cards {
                grid-template-columns: 1fr;
            }
            
            .buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌐 IoT Web Server</h1>
            <p class="subtitle">ESP32 多功能控制系統 v1.2</p>
        </header>
        
        <div class="status">
            <div class="status-title">📊 系統狀態</div>
            <div class="status-item">
                <span class="status-label">溫度</span>
                <span class="status-value"><span id="temp">--</span>°C</span>
            </div>
            <div class="status-item">
                <span class="status-label">濕度</span>
                <span class="status-value"><span id="humidity">--</span>%</span>
            </div>
            <div class="status-item">
                <span class="status-label">狀態</span>
                <span class="status-value"><span id="status">🟢 正常</span></span>
            </div>
        </div>
        
        <div class="cards">
            <div class="card">
                <div class="card-title">🌡️ 溫度</div>
                <div class="card-value" id="tempCard">--</div>
                <div class="card-unit">攝氏度</div>
            </div>
            <div class="card">
                <div class="card-title">💧 濕度</div>
                <div class="card-value" id="humidityCard">--</div>
                <div class="card-unit">相對濕度</div>
            </div>
            <div class="card">
                <div class="card-title">💡 光照</div>
                <div class="card-value" id="lightCard">--</div>
                <div class="card-unit">ADC 值</div>
            </div>
        </div>
        
        <div class="card" style="margin-bottom: 30px;">
            <div class="card-title">📇 RFID 最後讀取紀錄</div>
            <div class="card-value" id="rfidUid">尚未讀卡</div>
            <p>讀取時間：<span id="rfidReadAt">--</span></p>
            <p>讀卡任務：<span id="rfidStatus">等待資料</span></p>
            <p id="rfidError"></p>
            <div class="card-unit">保留最後成功結果（包含檢查碼），不代表卡片仍在感應區；重啟後清空。</div>
        </div>

        <div class="buttons">
            <button class="btn-primary" onclick="toggleLED()">按鈕 1: 切換 LED</button>
            <button class="btn-primary" onclick="publishData()">按鈕 2: 發布數據</button>
        </div>
        
        <footer>
            <p>📡 實時數據刷新 | 🔄 每1秒更新一次</p>
            <p>IoT Web Server System v1.2 - 由 Microdot 提供支持</p>
        </footer>
    </div>
    
    <script>
        // 自動刷新數據
        async function updateData() {
            try {
                const response = await fetch('/api/data');
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                
                // 更新溫度
                const temp = data.temp ?? '--';
                document.getElementById('temp').textContent = temp;
                document.getElementById('tempCard').textContent = temp;
                
                // 更新濕度
                const humidity = data.humidity ?? '--';
                document.getElementById('humidity').textContent = humidity;
                document.getElementById('humidityCard').textContent = humidity;
                
                // 更新光照
                const light = data.light ?? '--';
                document.getElementById('lightCard').textContent = light;

                const rfid = data.rfid || {};
                const rfidLabels = {
                    starting: '初始化中',
                    ready: '已初始化，持續輪詢',
                    init_error: '初始化失敗',
                    read_error: '讀卡異常，持續重試'
                };
                document.getElementById('rfidUid').textContent = rfid.last_uid ?? '尚未讀卡';
                document.getElementById('rfidReadAt').textContent = rfid.last_read_at ?? '--';
                document.getElementById('rfidStatus').textContent = rfidLabels[rfid.status] || '未知';
                document.getElementById('rfidError').textContent = rfid.error ?? '';
                document.getElementById('status').textContent = '🟢 正常';
                
            } catch (error) {
                console.error('數據更新失敗:', error);
                document.getElementById('status').textContent = '🔴 連接失敗';
                document.getElementById('rfidStatus').textContent = '連接失敗，顯示上次資料';
            }
        }
        
        // 切換 LED
        async function toggleLED() {
            try {
                const response = await fetch('/api/led/toggle', { method: 'POST' });
                if (response.ok) {
                    console.log('LED 已切換');
                }
            } catch (error) {
                console.error('LED 控制失敗:', error);
            }
        }
        
        // 發布數據
        async function publishData() {
            try {
                const response = await fetch('/api/publish', { method: 'POST' });
                if (response.ok) {
                    console.log('數據已發布到 MQTT');
                    alert('✅ 溫濕度數據已發布到 MQTT');
                }
            } catch (error) {
                console.error('發布失敗:', error);
                alert('❌ 發布失敗，請檢查 MQTT 連接');
            }
        }
        
        // 頁面加載時立即更新一次，然後每1秒更新
        updateData();
        setInterval(updateData, 1000);
    </script>
</body>
</html>
